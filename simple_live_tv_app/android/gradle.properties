# JVM memory tuned for a 7 GB RAM machine. The previous -Xmx8G/-XX:MaxMetaspaceSize=4G
# exceeded physical RAM and caused the Gradle daemon to crash with
# "Native memory allocation (mmap) failed ... G1 virtual space" (hs_err_pid*).
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
# Disable Kotlin incremental compilation to avoid the Windows cross-drive
# "different roots" crash (plugin sources on C: vs build dir on D:).
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
kotlin.daemon.jvmargs=-Xmx768m
