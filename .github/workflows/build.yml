name: Build Android TV APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.3"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Decode signing key & write key.properties
        # SIGNING_KEY  = base64 of the release keystore (.jks)
        # KEY_ALIAS / KEY_PASSWORD / KEY_STORE_PASSWORD = keystore credentials
        run: |
          mkdir -p simple_live_tv_app/android/app
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > simple_live_tv_app/android/app/key.jks
          cat > simple_live_tv_app/android/key.properties <<'EOF'
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=key.jks
          EOF

      - name: Flutter pub get
        working-directory: simple_live_tv_app
        run: flutter pub get

      - name: Build release APK
        working-directory: simple_live_tv_app
        run: |
          chmod +x android/gradlew
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: simple_live_tv_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
