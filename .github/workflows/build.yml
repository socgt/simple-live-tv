name: Build Android TV APK

# 触发条件：
#   - 推送到 main / master 分支
#   - 推送 v* 开头的 tag（例如 v1.0.0，会自动发 GitHub Release）
#   - 手动在 Actions 页面点击 Run workflow
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.38.3"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Android SDK & accept licenses
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages & NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # 无需任何 Secret：在 CI 内自动生成一个临时签名密钥。
      # 注意：每次构建的签名都不同，仅适合侧载/测试。
      # 若要发布可升级的版本，请在仓库 Secrets 中配置正式 keystore（见 README）。
      - name: Generate ephemeral signing key
        working-directory: simple_live_tv_app/android
        run: |
          keytool -genkeypair -v -keystore key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias simple_live_tv -storepass android -keypass android \
            -dname "CN=SimpleLiveTV, OU=CI, O=SimpleLiveTV, L=CI, S=CI, C=CN"
          cat > key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=simple_live_tv
          storeFile=key.jks
          EOF

      - name: Flutter pub get
        working-directory: simple_live_tv_app
        run: flutter pub get

      - name: Build release APK
        working-directory: simple_live_tv_app
        run: |
          chmod +x android/gradlew
          flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-tv-apk
          path: simple_live_tv_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release (on tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: simple_live_tv_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
